syntax = "proto3";

package restwell.v1;

// Tijdstippen (`_ms`): Unix-tijd in milliseconden, UTC.
service RestWellService {
  // Alle kamers.
  rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse);

  // Drempels van een kamer, bv. om in de app de comfortzone te tonen.
  rpc ListThresholds(ListThresholdsRequest) returns (ListThresholdsResponse);

  // Past één drempel aan. Werkt meteen: de Pi leest de drempels bij elke meting.
  rpc UpdateThreshold(UpdateThresholdRequest) returns (UpdateThresholdResponse);

  // Live: laatste meting, daarna elke nieuwe meting en alarmwijziging.
  rpc WatchRoom(WatchRoomRequest) returns (stream WatchRoomResponse);

  // Metingen vanaf een tijdstip, oudste eerst.
  rpc ListReadings(ListReadingsRequest) returns (ListReadingsResponse);

  // Alarmen die aandacht vragen: nog niet opgelost, of opgelost maar nog door niemand gezien.
  rpc ListOpenAlarms(ListOpenAlarmsRequest) returns (ListOpenAlarmsResponse);

  // Alarmgeschiedenis: elk alarm dat sinds since_ms liep, in elke status, nieuwste eerst.
  // Ook een alarm dat vroeger begon, maar sindsdien nog liep of opgelost werd.
  rpc ListAlarms(ListAlarmsRequest) returns (ListAlarmsResponse);

  // "Ik heb het gezien": ACTIVE wordt ACKNOWLEDGED (buzzer stopt); een RESOLVED alarm
  // blijft RESOLVED maar krijgt acknowledged_by en acknowledged_at_ms.
  rpc AcknowledgeAlarm(AcknowledgeAlarmRequest) returns (AcknowledgeAlarmResponse);
}

// ---------- Gegevens ----------

message Room {
  string id = 1;
  string name = 2;
}

// Leeg veld = sensor gaf geen waarde.
message Reading {
  string room_id = 1;
  int64 timestamp_ms = 2;
  optional double temperature_c = 3;
  optional double humidity_percent = 4;
  optional int32 light_raw = 5;  // ruwe waarde van de lichtsensor: 0 (donker) tot 1023 (fel licht), geen lux
  reserved 6;  // was sound_db: er is geen geluidssensor
  reserved "sound_db";
  optional bool motion_detected = 7;
}

// Kolom `sensor` in de database.
enum Metric {
  METRIC_UNSPECIFIED = 0;
  METRIC_TEMPERATURE = 1;  // 'temperature'
  METRIC_HUMIDITY = 2;     // 'humidity'
  METRIC_LIGHT = 3;        // 'light'
  reserved 4;  // was METRIC_SOUND: er is geen geluidssensor
  reserved "METRIC_SOUND";
  METRIC_MOTION = 5;       // 'motion'
}

// Kolom `status` in de database.
enum AlarmStatus {
  ALARM_STATUS_UNSPECIFIED = 0;
  ALARM_STATUS_ACTIVE = 1;        // 'active'
  ALARM_STATUS_ACKNOWLEDGED = 2;  // 'acknowledged': gezien
  ALARM_STATUS_RESOLVED = 3;      // 'resolved': waarde weer normaal (gezien als acknowledged_at_ms gezet is)
}

message Alarm {
  int64 id = 1;
  string room_id = 2;
  Metric metric = 3;
  optional double value = 4;
  string reason = 5;
  AlarmStatus status = 6;
  int64 started_at_ms = 7;
  int32 buzzer_after_sec = 8;  // buzzer als niemand het zo lang gezien heeft
  optional int64 acknowledged_at_ms = 9;
  optional string acknowledged_by = 10;
  optional int64 resolved_at_ms = 11;
}

// Eén rij uit de tabel `thresholds`. Leeg veld = geen grens aan die kant.
message Threshold {
  string room_id = 1;
  Metric metric = 2;
  optional double min_value = 3;        // in de eenheid van de sensor (zie Reading)
  optional double max_value = 4;
  optional int32 max_duration_sec = 5;  // pas alarm als de waarde zo lang buiten de grens blijft
  // Uren (0-23, lokale tijd van de Pi) waarin de regel geldt; loopt over middernacht als
  // from > to (licht: 22 tot 7). Beide leeg = altijd.
  optional int32 active_from_hour = 6;  // vanaf dit uur
  optional int32 active_to_hour = 7;    // tot dit uur, niet inbegrepen
}

// ---------- Requests en responses ----------

message ListRoomsRequest {}

message ListRoomsResponse {
  repeated Room rooms = 1;
}

message ListThresholdsRequest {
  string room_id = 1;
}

message ListThresholdsResponse {
  repeated Threshold thresholds = 1;
}

// De volledige nieuwe drempel: een leeg veld betekent "geen grens", niet "ongewijzigd".
// Uitzondering: laat je active_from_hour en active_to_hour allebei leeg, dan blijven de
// actieve uren ongewijzigd. Geef ze samen op; terug naar "altijd" kan (nog) niet.
message UpdateThresholdRequest {
  Threshold threshold = 1;
}

message UpdateThresholdResponse {
  Threshold threshold = 1;
}

message WatchRoomRequest {
  string room_id = 1;
}

message WatchRoomResponse {
  oneof event {
    Reading reading = 1;
    Alarm alarm = 2;
  }
}

message ListReadingsRequest {
  string room_id = 1;
  int64 since_ms = 2;
}

message ListReadingsResponse {
  repeated Reading readings = 1;
}

message ListOpenAlarmsRequest {
  string room_id = 1;
}

message ListOpenAlarmsResponse {
  repeated Alarm alarms = 1;
}

message ListAlarmsRequest {
  string room_id = 1;
  int64 since_ms = 2;
}

message ListAlarmsResponse {
  repeated Alarm alarms = 1;
}

message AcknowledgeAlarmRequest {
  int64 alarm_id = 1;
  string acknowledged_by = 2;
}

message AcknowledgeAlarmResponse {
  Alarm alarm = 1;
}
